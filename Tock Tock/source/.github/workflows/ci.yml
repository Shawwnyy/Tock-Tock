name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  ts-tests:
    name: Tests TypeScript (Bun) + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils   # pdftotext, utilisé par le test PDF
      - run: npm run typecheck
      - run: npm test
  sql-tests:
    name: Migrations + RLS (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: tocktock_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/test-sql.sh
        env: { TEST_DATABASE_URL: 'postgresql://postgres:pw@localhost:5432/tocktock_test' }
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemple.supabase.co
          VITE_SUPABASE_ANON_KEY: cle-factice-pour-le-build-uniquement-0000
