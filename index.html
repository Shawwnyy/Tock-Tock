it",intro:"Une chronique est un r\xE9sum\xE9 de ta journ\xE9e \xE9crit \xE0 partir de ce que tu as saisi.",rules:[{p:"invention",rule:"La chronique n'invente rien : elle ne reprend que tes r\xE9ponses, tes notes et tes objectifs.",why:"Un r\xE9cit cr\xE9dible mais inexact pourrait te faire douter de ton propre ressenti."},{p:"invention",rule:"Sans donn\xE9es suffisantes, aucune chronique n'est fabriqu\xE9e.",why:"Une \xAB fausse \xBB chronique remplie de g\xE9n\xE9ralit\xE9s n'aurait aucune valeur."},{p:"honnete",rule:"Les jours pass\xE9s sont rattrap\xE9s \xE0 l'ouverture (14 jours maximum). Le jour en cours se g\xE9n\xE8re \xE0 la demande.",why:"Une chronique \xAB de minuit \xBB raconte une journ\xE9e termin\xE9e. Au-del\xE0 de 14 jours, on \xE9vite de recr\xE9er en masse de vieux r\xE9sum\xE9s que tu n'as pas demand\xE9s."},{p:"donnees",rule:"La douleur et les notes personnelles sont exclues du PDF de chronique par d\xE9faut.",why:"Un PDF circule facilement (e-mail, impression). Les \xE9l\xE9ments les plus sensibles ne doivent y figurer que si tu le d\xE9cides."},{p:"main",rule:"Tu peux r\xE9g\xE9n\xE9rer ou supprimer une chronique \xE0 tout moment ; ton bilan n'est jamais touch\xE9.",why:"La chronique est d\xE9riv\xE9e de tes donn\xE9es, pas l'inverse."}]},{id:"observations",title:"4. R\xE8gles des observations et s\xE9ries",intro:"Tock Tock d\xE9crit tes donn\xE9es ; il ne les interpr\xE8te pas \xE0 ta place.",rules:[{p:"invention",rule:"Aucune observation avant 7 jours de bilans. Une tendance exige au moins 5 jours avec donn\xE9es sur chacune des deux p\xE9riodes compar\xE9es.",why:"Avec trop peu de jours, le hasard fait des \xAB tendances \xBB. Mieux vaut attendre."},{p:"invention",rule:"Une \xE9tiquette n'est compar\xE9e que si elle compte au moins 3 jours avec et 3 jours sans, et si l'\xE9cart atteint 0,5 point.",why:"On \xE9vite de t'annoncer qu'un \xE9v\xE9nement \xAB change tout \xBB sur la base d'un seul jour."},{p:"honnete",rule:"Le lien sommeil/moral exige au moins 10 jours de donn\xE9es et se pr\xE9sente toujours comme un lien constat\xE9, jamais une cause.",why:"Deux choses qui varient ensemble ne s'expliquent pas forc\xE9ment l'une l'autre."},{p:"humain",rule:"La s\xE9rie de jours se calcule en jours cons\xE9cutifs avec bilan ; une pause remet la s\xE9rie en cours \xE0 z\xE9ro mais n'efface ni la meilleure s\xE9rie ni tes donn\xE9es.",why:"La s\xE9rie motive sans punir : il n'y a ni classement, ni perte."}]},{id:"objectifs",title:"5. Objectifs, \xE9tapes et petites victoires",intro:"Pour avancer \xE0 ton rythme, sans pression ni comparaison.",rules:[{p:"invention",rule:"L'avancement d'un objectif se calcule uniquement \xE0 partir des \xE9tapes que tu coches.",why:"2 \xE9tapes faites sur 4 = 50 %, point. Aucun pourcentage \xAB encourageant \xBB invent\xE9, et un objectif sans \xE9tape n'affiche pas de pourcentage."},{p:"humain",rule:"Un objectif non atteint n'est pas un \xE9chec : tu peux le mettre en pause, le terminer ou l'archiver, sans p\xE9nalit\xE9.",why:"Culpabiliser fait abandonner. Les plans changent, et c'est normal."},{p:"main",rule:"Une \xE9ch\xE9ance est un rep\xE8re, pas une sanction : la d\xE9passer ne supprime et ne bloque rien.",why:"Tu d\xE9cides si la date compte encore ; l'application ne d\xE9cide pas \xE0 ta place."},{p:"main",rule:"Supprimer un objectif supprime ses \xE9tapes, mais jamais tes bilans.",why:"Chaque donn\xE9e a son propre espace : retirer un projet ne doit pas effacer ton historique."},{p:"humain",rule:"Tes petites victoires sont not\xE9es par toi et ne sont jamais compar\xE9es \xE0 celles des autres.",why:"Noter ce qui va bien aide, \xE0 condition de ne pas devenir une course."}]},{id:"bienetre",title:"6. Respiration, ancrage, assistant et biblioth\xE8que",intro:"Des outils pour se poser et s'informer, \xE0 utiliser avec bon sens.",rules:[{p:"humain",rule:"Les exercices de respiration et d'ancrage sont des outils de d\xE9tente, pas un traitement.",why:"Ils peuvent aider \xE0 se poser ; ils ne soignent pas une anxi\xE9t\xE9 ou une d\xE9pression. Si cela ne suffit pas, parle \xE0 un professionnel."},{p:"main",rule:"Tu peux arr\xEAter un exercice \xE0 tout moment. Si tu te sens mal \xE0 l'aise ou pris de vertige, reprends une respiration normale.",why:"Ton ressenti passe avant la consigne."},{p:"honnete",rule:"L'assistant de cette version est un guide aux r\xE9ponses \xE9crites \xE0 l'avance : il n'utilise aucune intelligence artificielle et ne diagnostique rien.",why:"Tu sais toujours qui te r\xE9pond : un script relu et fixe, pas un mod\xE8le qui improvise."},{p:"humain",rule:"Si tes mots \xE9voquent une d\xE9tresse, l'assistant s'interrompt et te montre d'abord des ressources humaines.",why:"Une personne qui va mal a besoin d'un humain avant d'avoir besoin d'un exercice."},{p:"honnete",rule:"Les articles de la biblioth\xE8que informent ; ils ne remplacent pas l'avis d'un professionnel.",why:"Un texte g\xE9n\xE9ral ne conna\xEEt pas ta situation."}]},{id:"confidentialite",title:"7. Confidentialit\xE9, sauvegardes et code PIN",intro:tF?"Tes bilans sont dans ton navigateur. Seule la connexion par code contacte un serveur.":"Cette version fonctionne sans serveur : tes donn\xE9es sont dans ton navigateur.",rules:[tF?{p:"donnees",rule:"Tes bilans, notes, douleur et objectifs ne quittent jamais ton appareil. Seule la connexion par code contacte le serveur d'authentification.",why:"La page n'est autoris\xE9e (politique de s\xE9curit\xE9 du navigateur) \xE0 parler qu'\xE0 ce serveur-l\xE0, et uniquement pour t'envoyer puis v\xE9rifier un code."}:{p:"donnees",rule:"Rien n'est envoy\xE9 sur Internet : la page est bloqu\xE9e en r\xE9seau par sa propre politique de s\xE9curit\xE9.",why:"Tes bilans n'ont pas \xE0 quitter ton appareil. Tu peux le v\xE9rifier : la page fonctionne sans connexion."},{p:"honnete",rule:"Vider les donn\xE9es du navigateur efface tout. Fais des sauvegardes PDF r\xE9guli\xE8res ; un rappel appara\xEEt apr\xE8s 14 jours.",why:"Il n'existe pas de copie ailleurs. C'est le prix de la confidentialit\xE9 totale."},{p:"donnees",rule:"Le PDF de sauvegarde contient TOUTES tes donn\xE9es (bilans, notes, douleur, objectifs). Garde-le comme un document priv\xE9.",why:"Une sauvegarde incompl\xE8te ne servirait \xE0 rien le jour o\xF9 tu en as besoin ; mais elle est aussi sensible que l'original."},{p:"donnees",rule:"Le rapport PDF de p\xE9riode n'inclut ni la douleur ni tes notes, sauf si tu les coches une par une.",why:"Ce document est fait pour \xEAtre montr\xE9 (\xE0 un soignant, par exemple) : tu d\xE9cides \xE0 chaque fois de ce que tu partages."},{p:"honnete",rule:"Le code PIN masque l'\xE9cran \xE0 l'ouverture, il ne chiffre pas les donn\xE9es.",why:"Il prot\xE8ge contre un regard de passage, pas contre quelqu'un qui sait ouvrir les outils du navigateur. Mieux vaut ne pas laisser d'autres personnes utiliser ta session."},{p:"donnees",rule:"Les tickets d'aide sont enregistr\xE9s sur ton appareil et ne contiennent que ce que tu \xE9cris, plus (si tu coches la case) des informations techniques sans aucun contenu de bilan.",why:"Demander de l'aide ne doit jamais t'obliger \xE0 exposer tes donn\xE9es personnelles."}]},{id:"compte",title:"8. Compte, e-mail, t\xE9l\xE9phone et code de connexion",intro:"Pas de mot de passe \xE0 retenir : tu prouves que l'adresse ou le num\xE9ro est \xE0 toi gr\xE2ce \xE0 un code envoy\xE9.",rules:[{p:"main",rule:"Dans la version fichier, un compte n'est jamais obligatoire : tu peux \xAB continuer sans compte \xBB.",why:"Ton suivi ne doit pas d\xE9pendre d'un service en ligne. Le compte n'ajoute ici qu'une preuve que l'identifiant est bien \xE0 toi."},{p:"honnete",rule:"Le format de l'adresse ou du num\xE9ro est v\xE9rifi\xE9 avant tout envoi, et l'\xE9cran te dit pr\xE9cis\xE9ment ce qui ne va pas.",why:"Une faute de frappe enverrait un code \xE0 un inconnu ; et chaque SMS a un co\xFBt. Attention : un format valide ne prouve pas que l'adresse ou le num\xE9ro existe, seul le code le prouve."},{p:"honnete",rule:"Un num\xE9ro doit \xEAtre un mobile : 06 ou 07 en France, ou une forme internationale commen\xE7ant par \xAB + \xBB et l'indicatif du pays.",why:"Une ligne fixe ou une box ne re\xE7oit pas de SMS. Sans \xAB + \xBB, le num\xE9ro est lu comme un num\xE9ro fran\xE7ais."},{p:"invention",rule:"Le code est envoy\xE9 et v\xE9rifi\xE9 par le serveur d'authentification. L'application ne le g\xE9n\xE8re jamais, ne l'affiche jamais et ne le simule jamais.",why:"Si l'application connaissait le code, n'importe qui pourrait entrer \xE0 ta place. Un faux code donnerait une fausse impression de s\xE9curit\xE9."},{p:"honnete",rule:"Le code comporte 6 chiffres, expire au bout de 10 minutes et ne s'utilise qu'une fois ; utilise toujours le dernier code re\xE7u.",why:"Limiter la dur\xE9e limite le risque si quelqu'un voit ton \xE9cran ou ton t\xE9l\xE9phone."},{p:"humain",rule:"Au plus un envoi par minute, et un nombre d'essais limit\xE9 (5 par code dans l'\xE9cran, plus une limite c\xF4t\xE9 serveur).",why:"Un code \xE0 6 chiffres a un million de possibilit\xE9s : sans limite, on pourrait le deviner au hasard, ou te faire payer des SMS \xE0 r\xE9p\xE9tition."},{p:"humain",rule:"Personne de Tock Tock ne te demandera jamais ton code, ni par e-mail, ni par SMS, ni par t\xE9l\xE9phone.",why:"C'est l'arnaque la plus courante : quelqu'un te demande \xAB le code que tu viens de recevoir \xBB pour entrer dans ton compte."},{p:"donnees",rule:"Ton e-mail et ton num\xE9ro ne sont jamais visibles des autres membres et ne servent qu'\xE0 te connecter (et \xE0 t'envoyer ta chronique par e-mail si tu l'actives).",why:"Un identifiant de connexion n'a pas \xE0 devenir une coordonn\xE9e publique."},{p:"donnees",rule:"Un SMS ne contient que le code : jamais une donn\xE9e de bien-\xEAtre.",why:"Un SMS s'affiche sur l'\xE9cran verrouill\xE9 et peut \xEAtre lu par n'importe qui autour de toi."},{p:"donnees",rule:"L'\xE9cran de connexion ne dit jamais si une adresse ou un num\xE9ro poss\xE8de d\xE9j\xE0 un compte.",why:"Sinon n'importe qui pourrait v\xE9rifier si une personne pr\xE9cise utilise Tock Tock."},{p:"donnees",rule:"Dans la version fichier, un compte confirm\xE9 ne conserve que la forme masqu\xE9e de ton identifiant (par exemple p\u2022\u2022\u2022\u2022\u2022@exemple.fr), jamais l'adresse compl\xE8te ni de jeton de connexion.",why:"Ce qu'on ne garde pas ne peut ni fuiter ni \xEAtre copi\xE9 depuis ta sauvegarde."}]},{id:"droits",title:"9. Tes droits : voir, exporter, corriger, supprimer",intro:"Tes donn\xE9es restent les tiennes, \xE0 tout moment.",rules:[{p:"main",rule:"Tu peux exporter tout ce que tu as saisi : sauvegarde PDF (restaurable) et CSV de tes r\xE9ponses.",why:"Pouvoir partir avec ses donn\xE9es est la meilleure garantie de ne pas \xEAtre enferm\xE9."},{p:"main",rule:"Tu peux modifier tes r\xE9ponses et supprimer tes objectifs, chroniques et petites victoires.",why:"Se tromper ou changer d'avis est normal : l'outil doit suivre."},{p:"main",rule:"\xAB Tout supprimer \xBB (R\xE9glages) efface d\xE9finitivement les donn\xE9es de cet appareil, apr\xE8s confirmation en tapant SUPPRIMER.",why:"C'est irr\xE9versible : la confirmation \xE9vite l'erreur de clic. Fais d'abord une sauvegarde si tu h\xE9sites."},{p:"donnees",rule:"Les PDF d\xE9j\xE0 t\xE9l\xE9charg\xE9s restent chez toi et sous ta responsabilit\xE9 tant que tu les gardes.",why:"Tock Tock ne peut pas les effacer \xE0 ta place : range-les, ou supprime-les si tu n'en as plus besoin."},{p:"main",rule:"Avec la version serveur, tu peux supprimer ton compte et tes donn\xE9es depuis les R\xE9glages.",why:"Quitter le service doit \xEAtre aussi simple que s'y inscrire."}]},{id:"aide",title:"10. R\xE8gles d'aide, de tickets et d'urgence",intro:"Le centre d'aide sert aux questions et aux probl\xE8mes d'utilisation.",rules:[{p:"humain",rule:"Un ticket n'est pas un service d'urgence. Si tu \xE9cris quelque chose qui \xE9voque une d\xE9tresse, des ressources d'aide humaines s'affichent aussit\xF4t.",why:"Un ticket peut attendre plusieurs jours ; une personne en d\xE9tresse, non."},{p:"honnete",rule:"Dans cette version locale, un ticket n'est pas envoy\xE9 automatiquement : tu l'exportes (PDF, copie ou e-mail) et tu le transmets.",why:"Aucun serveur ne re\xE7oit les tickets : annoncer un \xAB envoi \xBB serait mentir. Avec la version serveur, le ticket arrive directement dans la file du support."},{p:"honnete",rule:"Aucun d\xE9lai de r\xE9ponse n'est promis tant qu'aucune \xE9quipe de support n'est d\xE9sign\xE9e.",why:"Promettre un d\xE9lai que personne ne tient est pire que ne rien promettre."},{p:"donnees",rule:"\xC9vite de mettre dans un ticket des mots de passe, codes (y compris le code de connexion) ou donn\xE9es de sant\xE9 d\xE9taill\xE9es.",why:"Un ticket circule : mieux vaut d\xE9crire le probl\xE8me que recopier tes donn\xE9es."}]},{id:"communaute",title:"11. R\xE8gles de la communaut\xE9",scope:"Version serveur uniquement",intro:"Ces r\xE8gles s'appliquent \xE0 la version avec comptes (dossier \xAB source \xBB). Elles sont list\xE9es ici pour que tu saches \xE0 quoi t'attendre.",rules:[{p:"humain",rule:"Bienveillance : pas d'insultes, de harc\xE8lement, de menaces ni de discrimination.",why:"Un espace de soutien ne fonctionne que si chacun s'y sent en s\xE9curit\xE9."},{p:"donnees",rule:"Pas de donn\xE9es priv\xE9es (les tiennes ou celles d'autres personnes), pas d'arnaque ni de publicit\xE9.",why:"Ce qui est publi\xE9 peut \xEAtre lu par beaucoup de gens, et ne se retire pas toujours."},{p:"humain",rule:"Pas de conseil m\xE9dical pr\xE9sent\xE9 comme certain, pas d'incitation \xE0 des pratiques dangereuses.",why:"Un t\xE9moignage est pr\xE9cieux ; une prescription d\xE9guis\xE9e peut faire du mal."},{p:"humain",rule:"Les r\xE9actions sont uniquement positives et il n'y a aucun classement.",why:"La comparaison et la course aux \xAB likes \xBB nuisent au bien-\xEAtre."},{p:"humain",rule:"Chaque contenu peut \xEAtre signal\xE9 ; des humains examinent, expliquent leurs d\xE9cisions, et tu peux faire appel.",why:"Un filtre automatique se trompe : la d\xE9cision finale doit \xEAtre humaine et contestable."},{p:"honnete",rule:"Les sanctions sont gradu\xE9es (avertissement, restriction, suspension) et trac\xE9es.",why:"Pour rester proportionn\xE9es et v\xE9rifiables."},{p:"humain",rule:"La communaut\xE9 est ferm\xE9e aux moins de 15 ans ; l'\xE2ge est d\xE9claratif.",why:"Protection des plus jeunes. Limite connue : l'\xE2ge n'est pas v\xE9rifi\xE9."}]},{id:"ia",title:"12. Assistant avec intelligence artificielle",scope:"Version serveur uniquement",intro:"Dans la version serveur, l'assistant peut s'appuyer sur une IA. Elle est facultative et encadr\xE9e.",rules:[{p:"main",rule:"L'IA est d\xE9sactiv\xE9e tant que tu ne l'as pas activ\xE9e toi-m\xEAme, et tu peux la d\xE9sactiver \xE0 tout moment.",why:"Envoyer ses mots \xE0 un fournisseur externe est un choix personnel, pas une obligation pour utiliser l'appli."},{p:"donnees",rule:"Tu choisis ce qu'elle peut lire (bilans, objectifs, chroniques, douleur) : rien n'est partag\xE9 par d\xE9faut, et la m\xE9moire de l'assistant est d\xE9sactiv\xE9e par d\xE9faut.",why:"Moins l'IA en sait, moins il y a de donn\xE9es expos\xE9es : tu n'ouvres que ce dont tu as besoin."},{p:"humain",rule:"Avant tout envoi \xE0 l'IA, ton message est analys\xE9 : en cas de d\xE9tresse, des ressources humaines passent avant toute r\xE9ponse automatique.",why:"Une IA peut r\xE9pondre \xE0 c\xF4t\xE9 ; une personne en d\xE9tresse m\xE9rite mieux qu'un texte g\xE9n\xE9r\xE9."},{p:"humain",rule:"Les moins de 15 ans n'ont pas acc\xE8s \xE0 l'IA d'un fournisseur externe.",why:"Protection des plus jeunes, appliqu\xE9e par la base de donn\xE9es et pas seulement par l'\xE9cran."},{p:"honnete",rule:"L'IA peut se tromper : ses r\xE9ponses ne sont ni un avis m\xE9dical ni une v\xE9rit\xE9.",why:"Un texte fluide peut \xEAtre faux. V\xE9rifie, et parle \xE0 un professionnel pour toute question de sant\xE9."}]},{id:"discussion",title:"13. Discussion et partage de bilan (nom#)",scope:"Version discussion (avec le petit serveur)",intro:"Discuter avec des personnes que tu connais, sans compte : ton nom# (par exemple L\xE9o#18428) sert d'adresse.",rules:[{p:"humain",rule:"La discussion est r\xE9serv\xE9e aux 15 ans et plus : tu l'affirmes en l'activant.",why:"Protection des plus jeunes. Limite connue : l'\xE2ge est d\xE9claratif, il n'est pas v\xE9rifi\xE9."},{p:"donnees",rule:"Il n'y a ni annuaire ni salon public : on ne peut \xE9crire qu'\xE0 quelqu'un dont on conna\xEEt le nom#.",why:"Ainsi personne ne peut \xEAtre contact\xE9 en masse par des inconnus. Le nom ET le num\xE9ro doivent correspondre."},{p:"donnees",rule:"Ton nom# est un pseudonyme : le num\xE9ro est tir\xE9 au hasard et ne contient ni ton e-mail ni ton t\xE9l\xE9phone. Sans compte, c'est une cl\xE9 secr\xE8te gard\xE9e sur ton appareil qui prouve que le num\xE9ro est le tien.",why:"Personne ne peut \xE9crire ou lire \xE0 ta place. Si tu vides les donn\xE9es du navigateur, la cl\xE9 dispara\xEEt : tu auras alors un nouveau num\xE9ro."},{p:"donnees",rule:"Personne ne voit ton bilan sans ton accord \xE0 chaque demande. Seules les moyennes du jour sont partag\xE9es ; la douleur et ta note ne partent que si tu les coches.",why:"Ton bilan est ce que tu as de plus priv\xE9. Tu choisis, \xE0 chaque fois, ce que l'autre peut voir. Un jour sans bilan s'affiche \xAB pas encore de bilan \xBB, jamais comme un z\xE9ro."},{p:"main",rule:"\xAB Toujours autoriser \xBB ne donne que les moyennes du jour et se retire d'un clic.",why:"Un accord pratique ne doit jamais devenir un accord oubli\xE9."},{p:"main",rule:"Tu peux bloquer quelqu'un \xE0 tout moment ; la personne bloqu\xE9e n'en est pas inform\xE9e.",why:"Se prot\xE9ger ne doit pas d\xE9clencher de repr\xE9sailles."},{p:"honnete",rule:"Les messages ne sont pas chiffr\xE9s de bout en bout : le relais les garde en m\xE9moire (24 h au plus, effac\xE9s d\xE8s r\xE9ception) et celui qui l'h\xE9berge pourrait les lire. N'\xE9cris ni mot de passe, ni code, ni information de sant\xE9 d\xE9taill\xE9e.",why:"Mieux vaut savoir ce qui n'est pas prot\xE9g\xE9 que croire \xE0 une confidentialit\xE9 qui n'existe pas."},{p:"humain",rule:"La discussion n'est pas un service d'urgence : si tu \xE9cris des mots qui \xE9voquent une d\xE9tresse, des ressources d'aide s'affichent (ton message part quand m\xEAme).",why:"On n'emp\xEAche personne de parler, mais on s'assure qu'il sache o\xF9 trouver une aide humaine."},{p:"humain",rule:"Bienveillance : pas d'insultes, de harc\xE8lement ni de menaces. Il n'y a pas de mod\xE9ration humaine ici : c'est pour cela que le blocage existe et qu'on ne parle qu'\xE0 des personnes qu'on conna\xEEt.",why:"Sans \xE9quipe pour intervenir, les protections doivent \xEAtre dans tes mains."},{p:"honnete",rule:"Un message n'est livr\xE9 que si la personne a activ\xE9 la discussion et que le relais fonctionne. Il n'y a pas d'accus\xE9 de lecture, et si le relais est \xE9teint, l'\xE9cran le dit.",why:"Annoncer \xAB envoy\xE9 \xBB quand rien n'est arriv\xE9 serait mentir."}]}];function rF(){let e=Nf.map((n,r)=>`${r+1}. ${n.title} : ${n.text}`).join(`
