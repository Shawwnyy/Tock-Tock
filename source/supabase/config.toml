# Configuration du CLI Supabase (développement local ET référence pour le projet hébergé).
# Les mêmes réglages doivent être faits dans le tableau de bord : Authentication > Providers/Email/URL configuration.
project_id = "tock-tock"

[api]
enabled = true
# Le schéma « private » n'est PAS exposé : il contient les fonctions de sécurité et ne doit jamais l'être.
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
# Code à usage unique : 6 chiffres, valable 10 minutes, un envoi par minute et par adresse au plus.
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# Connexion par SMS (code à usage unique). DÉSACTIVÉE tant qu'aucun fournisseur n'est configuré : voir docs/SETUP.md (section SMS).
# Clés à vérifier avec la version de votre CLI Supabase (`supabase --version`) : elles n'ont pas pu être exécutées pour de vrai ici.
[auth.sms]
enable_signup = false
enable_confirmations = true
template = "Ton code Tock Tock : {{ .Code }}. Ne le partage avec personne."
max_frequency = "60s"
# [auth.sms.twilio]
# enabled = true
# account_sid = "..."
# message_service_sid = "..."
# auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.rate_limit]
email_sent = 8
sms_sent = 8
token_verifications = 30

# Ces deux fonctions sont appelées par le planificateur (pas par un navigateur) : elles n'ont pas de jeton de membre
# et s'authentifient par l'en-tête secret x-cron-secret (comparaison à temps constant). Toutes les autres exigent un jeton valide.
[functions.scheduled-chronicles]
verify_jwt = false
[functions.maintenance]
verify_jwt = false
[functions.generate-chronicle]
verify_jwt = true
[functions.media-upload-init]
verify_jwt = true
[functions.media-upload-finalize]
verify_jwt = true
[functions.assistant]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
